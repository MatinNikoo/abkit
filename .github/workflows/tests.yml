name: tests

on:
  push:
  pull_request:

# the tests only need to read the code
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q

  # build the package the way a user gets it, install it in a clean env and test that copy
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl pytest hypothesis statsmodels scikit-learn matplotlib pyarrow openpyxl polars
          cd /tmp && /tmp/clean/bin/abkit --version
          cp -r $GITHUB_WORKSPACE/tests $GITHUB_WORKSPACE/results $GITHUB_WORKSPACE/docs $GITHUB_WORKSPACE/README.md /tmp/
          cd /tmp && /tmp/clean/bin/python -m pytest -q tests
