[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "abkit"
dynamic = ["version"]
description = "Statistics for online A/B tests: CUPED, ratio metrics, sample ratio checks, and tests you can check every day"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Matin Nikoomanzar"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.11", "pandas>=2.0", 'tomli>=2; python_version < "3.11"']
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
plots = ["matplotlib>=3.7"]
files = ["pyarrow>=14", "openpyxl>=3.1"]
dev = ["pytest>=7", "hypothesis>=6.80", "statsmodels>=0.14", "matplotlib>=3.7", "scikit-learn>=1.3",
       "pyarrow>=14", "openpyxl>=3.1", "polars>=2.0.0"]

[project.scripts]
abkit = "abkit.cli:main"

[project.urls]
Homepage = "https://github.com/MatinNikoo/abkit"

[tool.setuptools]
packages = ["abkit"]

[tool.setuptools.dynamic]
version = {attr = "abkit.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: simulation heavy tests"]
