[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abkit"
version = "0.1.0"
description = "Statistics for online A/B tests: CUPED, ratio metrics, sample ratio checks, and tests you can check every day"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Matin Nikoomanzar"}]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
abkit = "abkit.cli:main"

[project.urls]
Homepage = "https://github.com/MatinNikoo/abkit"

[tool.setuptools]
packages = ["abkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
